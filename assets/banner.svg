<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lupeng Han — terminal window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.6" stop-color="#39c5cf"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39c5cf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel">
      <rect x="4" y="4" width="1192" height="292" rx="14"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .line { opacity: 0; animation: fadeUp .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .l1 { animation-delay: .10s; }
    .l2 { animation-delay: .35s; }
    .l3 { animation-delay: .72s; }
    .l4 { animation-delay: .98s; }
    .l5 { animation-delay: 1.24s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#panel)">
    <rect x="4" y="4" width="1192" height="292" fill="url(#bg)"/>
    <circle cx="200" cy="60" r="230" fill="url(#glowGreen)"/>
    <circle cx="1030" cy="260" r="250" fill="url(#glowCyan)"/>
  </g>

  <rect x="4" y="4" width="1192" height="292" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M4 48 H1196" stroke="#30363d" stroke-width="1.5"/>

  <g class="line l1">
    <circle cx="32" cy="26" r="6.5" fill="#ff5f57"/>
    <circle cx="54" cy="26" r="6.5" fill="#febc2e"/>
    <circle cx="76" cy="26" r="6.5" fill="#28c840"/>
    <text x="100" y="31" font-size="13" fill="#8b949e">lupenghan@qiniu — zsh</text>
    <text x="1164" y="31" font-size="12" fill="#484f58" text-anchor="end">~/about</text>
  </g>

  <g class="line l2">
    <text x="40" y="102" font-size="17" fill="#3fb950">$</text>
    <text x="60" y="102" font-size="17" fill="#c9d1d9">whoami</text>
    <text x="60" y="146" font-size="26" font-weight="700" fill="url(#name)" letter-spacing="0.5">Lupeng Han</text>
    <text x="60" y="176" font-size="15" fill="#8b949e">backend engineer @ Qiniu · Shanghai</text>
  </g>

  <g class="line l3">
    <text x="40" y="216" font-size="17" fill="#3fb950">$</text>
    <text x="60" y="216" font-size="17" fill="#c9d1d9">cat focus.txt</text>
  </g>

  <g class="line l4">
    <text x="60" y="248" font-size="16" fill="#8b949e">Go · TypeScript · LLM Infra · Agent Tooling · MCP</text>
  </g>

  <g class="line l5">
    <text x="40" y="276" font-size="17" fill="#3fb950">$</text>
    <rect class="cursor" x="62" y="261" width="9" height="17" rx="1.5" fill="#3fb950"/>
  </g>

  <path d="M812 92 V246" stroke="#21262d" stroke-width="1.5"/>

  <g class="line l2">
    <text x="856" y="112" font-size="13" fill="#484f58">location</text>
    <text x="960" y="112" font-size="14" fill="#c9d1d9">Shanghai, CN</text>
    <text x="856" y="156" font-size="13" fill="#484f58">company</text>
    <text x="960" y="156" font-size="14" fill="#c9d1d9">Qiniu</text>
    <text x="856" y="200" font-size="13" fill="#484f58">status</text>
    <circle cx="966" cy="195" r="4" fill="#3fb950"/>
    <text x="980" y="200" font-size="14" fill="#c9d1d9">online</text>
    <text x="856" y="244" font-size="13" fill="#484f58">shell</text>
    <text x="960" y="244" font-size="14" fill="#c9d1d9">zsh</text>
  </g>
</svg>
